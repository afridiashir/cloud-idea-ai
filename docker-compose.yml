version: "3.9"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      # Pass build-time envs if needed
      args:
        DATABASE_URL: ${DATABASE_URL}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    restart: unless-stopped
    # Optional: mount prisma locally for dev hot reload (remove in prod)
    # volumes:
    #   - .:/app
